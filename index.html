<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitko">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Fitko</title>
<style>
:root {
  --bg: #14181d; --karta: #1e242c; --pole: #2a323c; --text: #eef1f4; --slabe: #9aa5b1;
  --akcent: #4cc38a; --akcent-text: #08130d; --varovani: #f0b24a; --chyba: #ef6b6b; --cara: #303945;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}
button, input { font: inherit; color: inherit; }
button { border: 0; border-radius: 10px; background: var(--pole); cursor: pointer; touch-action: manipulation; }
button:active { filter: brightness(1.25); }
#app { max-width: 560px; margin: 0 auto; }

header {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(10px + env(safe-area-inset-top)) 12px 8px; border-bottom: 1px solid var(--cara);
}
.lista { display: flex; align-items: center; gap: 8px; }
.lista h1 { font-size: 18px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lista small { display: block; font-size: 12px; font-weight: 400; color: var(--slabe); }
.lista button { height: 44px; min-width: 44px; padding: 0 12px; }
.sync.ceka { color: var(--varovani); }
.sync.vse { color: var(--akcent); }
.cipy { display: flex; gap: 6px; overflow-x: auto; padding-top: 8px; scrollbar-width: none; }
.cipy button { flex: none; height: 38px; padding: 0 14px; border-radius: 19px; font-size: 14px; }
.cipy button.vybrany { background: var(--akcent); color: var(--akcent-text); font-weight: 600; }

.karta { background: var(--karta); margin: 10px 0; padding: 12px 10px; }
@media (min-width: 560px) { .karta { border-radius: 14px; } }
.hlava { display: flex; gap: 10px; align-items: flex-start; }
.foto { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; background: var(--pole); flex: none; }
.hlava .nazev { flex: 1; min-width: 0; }
.vymenit { flex: none; width: 44px; height: 44px; font-size: 20px; color: var(--slabe); }
.karta.vynechana { opacity: .55; padding: 8px 10px; }
.karta.vynechana h2 { text-decoration: line-through; }
.vratit { flex: none; height: 40px; padding: 0 14px; font-size: 14px; }
.pridat-cvik { display: block; width: calc(100% - 20px); margin: 14px 10px 0; min-height: 52px; font-size: 16px; color: var(--akcent); background: transparent; border: 1px dashed var(--akcent); }
.misto { color: var(--varovani); font-size: 13px; }
.hlava h2 { font-size: 17px; margin: 0 0 2px; line-height: 1.25; }
.cil { color: var(--slabe); font-size: 14px; }
.karta.hotovo h2::after { content: " ✓"; color: var(--akcent); }
.lekar {
  margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 14px;
  background: rgba(240, 178, 74, .14); border: 1px solid var(--varovani); color: var(--varovani);
}
.info { margin-top: 8px; font-size: 14px; color: var(--slabe); }
.info b { color: var(--text); font-weight: 600; }
.navrh { color: var(--akcent); }
details { margin-top: 6px; font-size: 14px; color: var(--slabe); }
summary { padding: 6px 0; cursor: pointer; }

.radek {
  display: grid; align-items: center; gap: 3px; margin-top: 8px;
  grid-template-columns: 18px 36px minmax(0, 1fr) 36px 36px minmax(0, 1fr) 36px 50px;
}
.radek.bezvahy { grid-template-columns: 18px 48px minmax(0, 1fr) 48px 50px; }
.cislo { color: var(--slabe); font-size: 13px; text-align: center; }
.radek button { height: 46px; font-size: 20px; padding: 0; }
.radek input {
  height: 46px; width: 100%; text-align: center; border: 1px solid var(--cara);
  border-radius: 10px; background: var(--bg); font-size: 17px; font-weight: 600; padding: 0;
}
.radek input:focus { outline: 2px solid var(--akcent); outline-offset: -1px; }
.radek .zapsat { margin-left: 4px; border: 2px solid var(--akcent); background: transparent; color: var(--akcent); }
.radek.ok .zapsat { background: var(--akcent); color: var(--akcent-text); }
.radek.ok input { border-color: var(--akcent); }
.podradek { grid-column: 2 / -1; display: flex; justify-content: space-between; gap: 8px; }
.radek .podradek button {
  height: auto; min-height: 36px; padding: 4px 8px; font-size: 13px;
  text-align: left; background: transparent; color: var(--slabe);
}
.lupa {
  position: fixed; inset: 0; z-index: 20; background: rgba(8, 10, 12, .96);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top)) 8px calc(12px + env(safe-area-inset-bottom));
}
.lupa img { max-width: 100%; max-height: 40vh; object-fit: contain; border-radius: 10px; }
.lupa small { color: var(--slabe); }
.vyber {
  position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto;
  padding: calc(10px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
}
.vyber > #seznam, .vyber > .info, .vyber > input, .vyber > .velke { max-width: 528px; margin-left: auto; margin-right: auto; }
.vyber .lista { max-width: 528px; margin: 0 auto; }
.vyber input {
  display: block; width: 100%; height: 48px; margin-top: 12px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--cara); background: var(--karta);
}
.vyber label { display: block; margin: 16px 0 0; font-size: 14px; color: var(--slabe); }
.vyber p { color: var(--slabe); font-size: 14px; }
.vyber .velke { text-align: left; }
.souhrn { padding: 12px; border-radius: 10px; background: var(--karta); border: 1px solid var(--akcent); }
.pridat { margin: 10px 8px 0 0; height: 40px; padding: 0 14px; font-size: 14px; color: var(--slabe); background: transparent; border: 1px dashed var(--cara); }

.formular { padding: 20px 16px; }
.formular h1 { font-size: 22px; margin: 8px 0 4px; }
.formular p { color: var(--slabe); font-size: 14px; }
.formular label { display: block; margin: 14px 0 4px; font-size: 14px; color: var(--slabe); }
.formular input {
  width: 100%; height: 48px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--cara); background: var(--karta);
}
.velke { display: block; width: 100%; min-height: 52px; margin-top: 12px; padding: 8px 14px; font-size: 17px; }
.hlavni { background: var(--akcent); color: var(--akcent-text); font-weight: 600; }
.nebezpecne { color: var(--chyba); }
.hlaska { margin: 12px; padding: 10px 12px; border-radius: 10px; background: var(--karta); font-size: 14px; color: var(--slabe); }
.hlaska.chyba { color: var(--chyba); }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
